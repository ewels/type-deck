name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREK_VERSION: "0.4.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Install prek
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL "https://github.com/j178/prek/releases/download/v${PREK_VERSION}/prek-x86_64-unknown-linux-gnu.tar.gz" -o prek.tar.gz
          tar -xzf prek.tar.gz
          sudo mv prek-x86_64-unknown-linux-gnu/prek /usr/local/bin/prek
          prek --version

      - name: Cache prek hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ env.PREK_VERSION }}-${{ hashFiles('prek.toml') }}
          restore-keys: |
            prek-${{ runner.os }}-${{ env.PREK_VERSION }}-

      - name: Run prek hooks
        run: prek run --all-files --show-diff-on-failure

      - name: Type-check
        run: npx tsc --noEmit
